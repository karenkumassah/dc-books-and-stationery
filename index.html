const its=S.items.filter(i=>(cat==='All'||i.cat===cat)&&(!t||(i.name+' '+i.by).toLowerCase().includes(t)));
$('#list').innerHTML=its.length?`<div class="grid">${its.map(admin?editCard:card).join('')}</div>`:'<div class="empty">No items found.</div>'}
function pic(i){return i.img?`<img class="pic" src="/_blob/${esc(i.img)}" alt="${esc(i.name)}" loading="lazy">`:`<div class="pic ph">${esc((i.name||'?').trim().charAt(0).toUpperCase())}</div>`}
function card(i){const n=+i.stock||0;const s=n<=0?['s-out','Out of stock']:n<=5?['s-low','Only '+n+' left']:['s-ok','In stock'];
return`<div class="item">${pic(i)}<div class="info"><h3>${esc(i.name)}</h3>${i.by?`<p class="by">${esc(i.by)}</p>`:''}<span class="tag">${esc(i.cat)}</span> <span class="st ${s[0]}">${s[1]}</span></div><div class="buy"><div class="price">${money(i.price)}</div><button class="add" data-act="buy" data-id="${i.id}" ${n<=0?'disabled':''}>Add</button></div></div>`}
function editCard(i){const d=`data-id="${i.id}"`;
return`<div class="card"><div class="row"><div class="full">${pic(i)}</div><div class="full"><label>Name</label><input ${d} data-f="name" value="${esc(i.name)}"></div>
<div class="full"><label>Author / brand</label><input ${d} data-f="by" value="${esc(i.by)}"></div>
<div><label>Category</label><select ${d} data-f="cat">${CATS.map(c=>`<option${c===i.cat?' selected':''}>${c}</option>`).join('')}</select></div>
<div><label>Price (GH₵)</label><input ${d} data-f="price" type="number" min="0" step="0.01" value="${i.price}"></div>
<div><label>In stock</label><input ${d} data-f="stock" type="number" min="0" step="1" value="${i.stock}"></div>
<div class="stk">${[1,5,10,50].map(n=>`<button ${d} data-act="stk" data-n="${n}">Restock +${n}</button>`).join('')}<button class="del" ${d} data-act="del">Delete</button></div></div></div>`}
function setDirty(){dirty=true;const b=$('#save');if(b)b.disabled=false}
function panel(m){mode=m;const L=$('#login');const first=!S.hash;
const title=m==='pw'?'Change password':first?'Create your owner password':'Owner login';
L.innerHTML=`<div class="box"><h2>${title}</h2>${m==='pw'||first?'<input id="p1" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><input id="p2" type="password" placeholder="Repeat password" autocomplete="new-password">':'<input id="p1" type="password" placeholder="Password" autocomplete="current-password">'}<p class="err" id="err"></p><button class="btn" data-act="go">Continue</button><button data-act="x">Cancel</button></div>`;L.hidden=false;$('#p1').focus()}
async function go(){const a=$('#p1').value,b=$('#p2'),err=$('#err');
try{if(mode==='pw'||!S.hash){if(a.length<6){err.textContent='Use at least 6 characters.';return}if(a!==b.value){err.textContent='Passwords don’t match.';return}S.hash=await sha(a);dirty=true;unlock();toast('Password set. Press Save changes to keep it.')}
else{if(await sha(a)!==S.hash){err.textContent='Wrong password.';return}unlock()}}catch(e){err.textContent='Could not check password here.'}}
function unlock(){admin=true;try{sessionStorage.setItem('dcb','1')}catch(e){}render()}
function save(){try{localStorage.setItem('dcbooks-data-v1',JSON.stringify(S));dirty=false;const b=$('#save');if(b)b.disabled=true;toast('Saved on this device.')}catch(e){toast('Could not save. Check browser storage settings.')}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.cat){cat=t.dataset.cat;render();categoryFlair(cat);return}
const it=S.items.find(i=>i.id===t.dataset.id),act=t.dataset.act;
if(act==='buy'&&it){if((cart[it.id]||0)<(+it.stock||0)){cart[it.id]=(cart[it.id]||0)+1;bar();fly(t,'+1');t.textContent='Added ✓';t.classList.add('ok');setTimeout(()=>{t.textContent='Add';t.classList.remove('ok')},900)}else toast('No more in stock');return}
if(act==='cart'){cartPanel();return}
if(act==='cinc'&&it){if(cart[it.id]<(+it.stock||0))cart[it.id]++;cartPanel();bar();return}
if(act==='cdec'&&it){if(--cart[it.id]<=0)delete cart[it.id];cartPanel();bar();return}
if(act==='cdel'&&it){delete cart[it.id];cartPanel();bar();return}
if(act==='ps'){paySettings();return}
if(act==='theme'){theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;try{localStorage.setItem('dcbooks-theme',theme)}catch(e){}t.textContent=theme==='dark'?'Switch to light mode':'Switch to dark mode';return}
if(act==='request'){const L=$('#login');L.innerHTML=`<div class="box"><h2>Request a specific item</h2><p class="note">Tell us what you’re looking for, and we’ll check for you.</p><p class="note"><b>Example:</b> “Hi! Do you have a blue water bottle, about 750 ml?”</p><textarea id="item-request" placeholder="For example: Hi! Do you have a blue water bottle, about 750 ml?"></textarea><p class="note">Want to show us a reference photo? After WhatsApp opens, tap the + or paperclip in the chat to attach an image.</p><button class="btn" data-act="send-request">Continue to WhatsApp</button><button data-act="x">Cancel</button></div>`;L.hidden=false;return}
if(act==='send-request'){const msg=$('#item-request').value.trim();if(!msg){toast('Please describe the item you’re looking for.');return}const url='https://wa.me/233244641564?text='+encodeURIComponent('Hi DC Books and Stationery! I’m looking for: '+msg);window.open(url,'_blank','noopener');$('#login').hidden=true;return}
if(act==='login')panel('login');else if(act==='pw')panel('pw');else if(act==='x')$('#login').hidden=true;else if(act==='go')go();
else if(act==='out'){if(dirty&&!confirm('You have unsaved changes. Log out anyway?'))return;admin=false;try{sessionStorage.removeItem('dcb')}catch(x){}render()}
else if(act==='add'){S.items.unshift({id:Date.now().toString(36),name:'New item',by:'',cat:CATS[0],price:0,stock:0});setDirty();cat='All';q='';render()}
else if(act==='save')save();
else if(act==='stk'&&it){it.stock=(+it.stock||0)+(+t.dataset.n);setDirty();list()}
else if(act==='del'&&it){if(confirm('Delete “'+it.name+'”?')){S.items=S.items.filter(i=>i!==it);setDirty();list()}}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='q'){q=t.value;list();return}
if(t.dataset.ps){S.pay[t.dataset.ps]=t.value;setDirty();return}
if(t.dataset.k){F[t.dataset.k]=t.value;if(t.type==='radio')cartPanel();else{const w=$('#wa');if(w)w.href=waLink()}return}
const it=S.items.find(i=>i.id===t.dataset.id);if(!it||!t.dataset.f)return;
const f=t.dataset.f;it[f]=(f==='price'||f==='stock')?(t.value===''?0:+t.value):t.value;setDirty()});
let cart={},F={name:'',phone:'',addr:'',mode:'pickup',pay:'momo'};S.pay=S.pay||{momo:'',name:''};
const qty=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const lines=()=>Object.keys(cart).map(id=>[S.items.find(i=>i.id===id),cart[id]]).filter(x=>x[0]);
const tot=()=>lines().reduce((a,x)=>a+x[0].price*x[1],0);
function bar(){const b=$('#cbar');if(!b)return;const n=qty();b.hidden=!n||admin;b.innerHTML=n?`<button class="btn" data-act="cart">View cart (${n}) · ${money(tot())}</button>`:''}
function valid(){return F.name.trim()&&F.phone.trim()&&(F.mode==='pickup'||F.addr.trim())}
function waLink(){const t=['*New order – DC Books and Stationery*','Name: '+F.name,'Phone: '+F.phone,'','Items:',...lines().map(x=>`- ${x[1]} × ${x[0].name} (${money(x[0].price*x[1])})`),'','Total: '+money(tot()),F.mode==='pickup'?'Collection: pickup from the shop':'Delivery to: '+F.addr+' (delivery fee to be confirmed)','Payment: Mobile Money'];return'https://wa.me/233244641564?text='+encodeURIComponent(t.join('\n'))}
function cartPanel(){mode='';const L=$('#login'),ls=lines();if(!ls.length){L.hidden=true;return}
const mm=S.pay.momo?`Send <b>${money(tot())}</b> to <b>${esc(S.pay.momo)}</b>${S.pay.name?' ('+esc(S.pay.name)+')':''}, then share your payment screenshot or reference on WhatsApp.`:'We’ll send our Mobile Money number on WhatsApp once you place the order.';
L.innerHTML=`<div class="box" style="max-height:92vh;overflow:auto"><h2>Your order</h2>${ls.map(x=>`<div class="cl"><span>${esc(x[0].name)}<br><small>${money(x[0].price)} each</small></span><span class="q"><button data-act="cdec" data-id="${x[0].id}">−</button>${x[1]}<button data-act="cinc" data-id="${x[0].id}">+</button></span><b>${money(x[0].price*x[1])}</b></div>`).join('')}<div class="cl tot"><span>Total</span><b>${money(tot())}</b></div>
<input data-k="name" placeholder="Your name" value="${esc(F.name)}"><input data-k="phone" type="tel" placeholder="Phone / WhatsApp number" value="${esc(F.phone)}">
<div class="opt"><label><input type="radio" name="m" data-k="mode" value="pickup" ${F.mode==='pickup'?'checked':''}> Pick up in Dansoman</label><label><input type="radio" name="m" data-k="mode" value="delivery" ${F.mode==='delivery'?'checked':''}> Delivery</label></div>
${F.mode==='delivery'?`<input data-k="addr" placeholder="Delivery address / landmark" value="${esc(F.addr)}"><p class="note">Delivery fee is confirmed on WhatsApp.</p>`:''}
<p class="note"><b>Payment: Mobile Money</b> (MTN, Telecel, AirtelTigo)<br>${mm}</p>${hubHtml()}
<a class="btn go" id="wa" data-wa href="${waLink()}" target="_blank" rel="noopener">Send order on WhatsApp</a><button data-act="x">Keep shopping</button></div>`;L.hidden=false}
function hubHtml(){const h=(S.pay.hubtel||'').trim();if(!h)return'';return h.toLowerCase().startsWith('https://')?`<a class="btn go" href="${esc(h)}" target="_blank" rel="noopener">Pay with Hubtel</a><p class="note">Pay ${money(tot())} through Hubtel, then send your order on WhatsApp.</p>`:`<p class="note">Or pay with Hubtel: <b>${esc(h)}</b></p>`}
function fly(from,em){const to=$('#cbar button');if(!to||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),e=document.createElement('div');e.className='fly';e.textContent=em;e.style.left=a.left+a.width/2+'px';e.style.top=a.top+'px';document.body.appendChild(e);const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top-a.top;
e.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-60}px) scale(1.4) rotate(-12deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.3) rotate(10deg)`,opacity:.2}],{duration:700,easing:'cubic-bezier(.4,0,.2,1)'}).onfinish=()=>{e.remove();to.classList.remove('bump');void to.offsetWidth;to.classList.add('bump')}}
function paySettings(){mode='';$('#login').innerHTML=`<div class="box"><h2>Payment settings</h2><p class="note">Customers who choose Mobile Money see this number. Press Save changes after editing.</p><input data-ps="momo" type="tel" placeholder="Mobile Money number" value="${esc(S.pay.momo)}"><input data-ps="name" placeholder="Name on the account" value="${esc(S.pay.name)}"><input data-ps="hubtel" placeholder="Hubtel payment link or code (optional)" value="${esc(S.pay.hubtel)}"><p class="note">Paste a Hubtel payment link (starting with https://) to show a Pay with Hubtel button, or a Hubtel pay code to show it as text.</p><button class="btn" data-act="x">Done</button></div>`;$('#login').hidden=false}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-wa]');if(a&&!valid()){e.preventDefault();toast('Please enter your name, phone number and delivery address if needed.')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&mode&&!$('#login').hidden)go()});
render();
</script>
</body></html>
